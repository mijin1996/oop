<style>
/* Layout: RPG 퀘스트북 — 상단 경험치 바 + 파트 필터, 스테이지 카드가 세로로 이어지고 넓은 화면에선 설명|코드 2단 */
:root
{
  --bg: #F2F4FA;
  --surface: #FFFFFF;
  --ink: #1B2140;
  --muted: #586085;
  --line: #DADFEC;
  --accent: #3451D1;
  --accent-soft: #E6EBFF;
  --gold: #D9940F;
  --gold-soft: #FFF3D6;
  --p-oop: #3451D1;
  --p-test: #0B8A6B;
  --p-app: #7A47D6;
  --p-git: #D4520B;
  --code-bg: #1C2036;
  --code-fg: #E3E6F5;
  --code-kw: #FF8FB1;
  --code-str: #A5E07A;
  --code-num: #FFC861;
  --code-com: #8189AE;
  --code-type: #7FD3FF;
  --code-ann: #D7A6FF;
  --f-display: "Jua", "IBM Plex Sans KR", system-ui, sans-serif;
  --f-body: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --f-code: "JetBrains Mono", "IBM Plex Sans KR", ui-monospace, Consolas, monospace;
}
@media (prefers-color-scheme: dark)
{
  :root:not([data-theme="light"])
  {
    --bg: #0F1228;
    --surface: #171B36;
    --ink: #E7E9F7;
    --muted: #A0A7C8;
    --line: #2A3057;
    --accent: #8EA1FF;
    --accent-soft: #232B5C;
    --gold: #F3B93E;
    --gold-soft: #3A2F14;
    --p-oop: #8EA1FF;
    --p-test: #4FD1AE;
    --p-app: #BB9BFF;
    --p-git: #FF9A5C;
    --code-bg: #0B0E1F;
    color-scheme: dark;
  }
}
:root[data-theme="dark"]
{
  --bg: #0F1228;
  --surface: #171B36;
  --ink: #E7E9F7;
  --muted: #A0A7C8;
  --line: #2A3057;
  --accent: #8EA1FF;
  --accent-soft: #232B5C;
  --gold: #F3B93E;
  --gold-soft: #3A2F14;
  --p-oop: #8EA1FF;
  --p-test: #4FD1AE;
  --p-app: #BB9BFF;
  --p-git: #FF9A5C;
  --code-bg: #0B0E1F;
  color-scheme: dark;
}

*{ box-sizing: border-box; }
body
{
  background: var(--bg);
  color: var(--ink);
  font-family: var(--f-body);
  font-size: 16px;
  line-height: 1.65;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
body::before
{
  content: "";
  position: fixed;
  inset: 0 0 auto;
  height: env(safe-area-inset-top, 0px);
  z-index: 10;
  background: var(--bg);
}
.wrap{ max-width: 1080px; margin: 0 auto; }

/* ---------- hero ---------- */
header.hero{ padding-block: 40px 20px; display: grid; gap: 18px; }
.eyebrow{ font-size: 13px; letter-spacing: .08em; color: var(--muted); font-weight: 700; }
h1
{
  font-family: var(--f-display);
  font-weight: 400;
  font-size: clamp(34px, 6vw, 54px);
  line-height: 1.1;
  margin: 0;
  text-wrap: balance;
}
h1 .hl{ color: var(--accent); }
.lead{ margin: 0; color: var(--muted); max-width: 60ch; }

.pillars{ display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.pillar
{
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 14px;
  padding: 12px 14px;
  min-width: 0;
}
.pillar b{ font-family: var(--f-display); font-weight: 400; font-size: 20px; display: block; }
.pillar span{ font-size: 13.5px; color: var(--muted); }
@media (max-width: 560px){ .pillars{ grid-template-columns: 1fr; } }

/* ---------- sticky bar ---------- */
.bar
{
  position: sticky;
  top: env(safe-area-inset-top, 0px);
  z-index: 5;
  background: var(--bg);
  padding-block: 10px;
  border-bottom: 1px solid var(--line);
  display: grid;
  gap: 10px;
}
.xp{ display: flex; align-items: center; gap: 12px; }
.xp-label{ font-family: var(--f-display); font-size: 18px; white-space: nowrap; }
.xp-track{ flex: 1; height: 12px; border-radius: 99px; background: var(--gold-soft); overflow: hidden; border: 1px solid var(--line); }
.xp-fill{ height: 100%; width: 0; background: var(--gold); border-radius: 99px; transition: width .4s ease; }
.xp-num{ font-variant-numeric: tabular-nums; font-size: 14px; color: var(--muted); white-space: nowrap; }
.tabs{ display: flex; gap: 8px; flex-wrap: wrap; }
.tab
{
  font: inherit;
  font-size: 14px;
  font-weight: 500;
  border: 1px solid var(--line);
  background: var(--surface);
  color: var(--ink);
  padding: 5px 14px;
  border-radius: 99px;
  cursor: pointer;
}
.tab[aria-pressed="true"]{ background: var(--ink); color: var(--bg); border-color: var(--ink); }
.tab:focus-visible, .clear:focus-visible, summary:focus-visible{ outline: 3px solid var(--accent); outline-offset: 2px; }

/* ---------- parts & stages ---------- */
main{ padding-block: 8px 60px; display: grid; gap: 22px; }
.part-head{ display: flex; align-items: baseline; gap: 12px; margin-top: 18px; }
.part-head h2{ font-family: var(--f-display); font-weight: 400; font-size: 28px; margin: 0; }
.part-head small{ color: var(--muted); font-size: 14px; }

.stage
{
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 18px;
  padding: 22px;
  display: grid;
  gap: 16px;
  scroll-margin-top: 120px;
}
.stage.done{ border-color: var(--gold); }
.stage-top{ display: flex; align-items: flex-start; gap: 14px; flex-wrap: wrap; }
.badge
{
  font-family: var(--f-display);
  font-size: 15px;
  padding: 3px 12px;
  border-radius: 99px;
  color: var(--surface);
  background: var(--pc);
  white-space: nowrap;
}
.stage-title{ flex: 1; min-width: 0; }
.stage-title h3{ font-family: var(--f-display); font-weight: 400; font-size: 26px; margin: 0; line-height: 1.2; text-wrap: balance; }
.stage-title .src{ font-size: 12.5px; color: var(--muted); }
.clear
{
  font: inherit;
  font-size: 14px;
  font-weight: 700;
  border: 1.5px solid var(--gold);
  color: var(--gold);
  background: transparent;
  padding: 5px 14px;
  border-radius: 10px;
  cursor: pointer;
  white-space: nowrap;
}
.stage.done .clear{ background: var(--gold); color: var(--surface); }

.hook
{
  background: var(--accent-soft);
  border-radius: 12px;
  padding: 12px 16px;
  font-weight: 500;
  font-size: 16.5px;
}
.hook::before{ content: "한 줄 요약 "; font-family: var(--f-display); color: var(--accent); margin-right: 6px; font-weight: 400; }

.body{ display: grid; grid-template-columns: minmax(0, 1fr); gap: 18px; }
@media (min-width: 900px){ .body{ grid-template-columns: minmax(0, 1fr) minmax(0, 1.1fr); align-items: start; } }
.points{ margin: 0; padding: 0; list-style: none; display: grid; gap: 9px; min-width: 0; }
.points li{ position: relative; padding-left: 20px; }
.points li::before
{
  content: "";
  position: absolute;
  left: 2px;
  top: .62em;
  width: 8px;
  height: 8px;
  border-radius: 2px;
  background: var(--pc);
  transform: rotate(45deg);
}
.left{ display: grid; gap: 14px; min-width: 0; }
code.i
{
  font-family: var(--f-code);
  font-size: .86em;
  font-weight: 700;
  background: var(--accent-soft);
  color: var(--ink);
  padding: 1px 6px;
  border-radius: 6px;
  white-space: nowrap;
}

.tbl-wrap{ overflow-x: auto; border: 1px solid var(--line); border-radius: 12px; }
table{ border-collapse: collapse; width: 100%; font-size: 14.5px; }
th, td{ padding: 8px 12px; text-align: left; border-bottom: 1px solid var(--line); vertical-align: top; }
th{ font-size: 13px; color: var(--muted); font-weight: 700; background: var(--bg); }
tr:last-child td{ border-bottom: 0; }
td:first-child{ font-family: var(--f-code); font-size: 13.5px; font-weight: 700; white-space: nowrap; }

.code{ min-width: 0; background: var(--code-bg); border-radius: 14px; overflow: hidden; }
.code-head{ display: flex; justify-content: space-between; align-items: center; padding: 8px 14px; font-family: var(--f-code); font-size: 12px; color: var(--code-com); border-bottom: 1px solid rgba(127,137,174,.25); }
.code-head .dots{ display: flex; gap: 6px; }
.code-head .dots i{ width: 10px; height: 10px; border-radius: 50%; background: var(--code-com); opacity: .5; display: block; }
pre{ margin: 0; padding: 14px 16px 16px; overflow-x: auto; font-family: var(--f-code); font-size: 13.5px; font-weight: 700; line-height: 1.6; color: var(--code-fg); tab-size: 4; }
.k{ color: var(--code-kw); }
.s{ color: var(--code-str); }
.n{ color: var(--code-num); }
.c{ color: var(--code-com); font-style: italic; }
.t{ color: var(--code-type); }
.a{ color: var(--code-ann); }

details.quiz{ border: 1.5px dashed var(--pc); border-radius: 12px; padding: 10px 14px; }
details.quiz summary{ cursor: pointer; font-weight: 700; list-style: none; }
details.quiz summary::-webkit-details-marker{ display: none; }
details.quiz summary::before{ content: "퀴즈 "; font-family: var(--f-display); font-weight: 400; color: var(--pc); margin-right: 4px; }
details.quiz summary::after{ content: "  · 눌러서 정답 보기"; font-weight: 400; font-size: 13px; color: var(--muted); }
details.quiz[open] summary::after{ content: ""; }
details.quiz .ans{ margin-top: 8px; padding-top: 8px; border-top: 1px solid var(--line); }
details.quiz .ans::before{ content: "정답 "; font-family: var(--f-display); color: var(--gold); margin-right: 4px; }

footer{ color: var(--muted); font-size: 13px; padding-block: 0 40px; text-align: center; }

@media (max-width: 560px)
{
  .stage{ padding: 16px; }
  .stage-title h3{ font-size: 22px; }
  pre{ font-size: 12.5px; }
}
@media (prefers-reduced-motion: reduce){ .xp-fill{ transition: none; } }
</style>

<div class="wrap">
  <header class="hero">
    <div class="eyebrow">1학기 · JAVA 기초/응용 · GIT</div>
    <h1>자바 1학기 <span class="hl">퀘스트북</span></h1>
    <p class="lead">수업 자료 15개를 스테이지 14개로 줄였어요. 한 줄 요약 → 핵심 → 코드 → 퀴즈 순서로 보고, 다 이해했으면 <b>클리어</b>를 눌러 경험치를 모아 보세요.</p>
    <div class="pillars">
      <div class="pillar"><b>캡슐화</b><span>중요한 값은 숨기고 정해진 창구로만</span></div>
      <div class="pillar"><b>상속</b><span>부모 것을 물려받고 다른 점만 추가</span></div>
      <div class="pillar"><b>다형성</b><span>하나를 여러 이름으로 부를 수 있다</span></div>
    </div>
  </header>

  <div class="bar">
    <div class="xp">
      <span class="xp-label">EXP</span>
      <div class="xp-track"><div class="xp-fill" id="xpFill"></div></div>
      <span class="xp-num" id="xpNum">0 / 14</span>

    <div class="tabs" id="tabs" role="group" aria-label="파트 고르기"></div>
  </div>

  <main id="main"></main>
  <footer>객체지향 3대 특징 + 테스트 + 응용 + Git, 시험 전에 한 번 더 훑어보기</footer>
</div>

<script>
const PARTS =
{
  oop:  { name: "PART 1 · 객체지향 기초", sub: "8~13장", color: "var(--p-oop)" },
  test: { name: "PART 2 · 테스트", sub: "8-2, 9-2장", color: "var(--p-test)" },
  app:  { name: "PART 3 · 자바 응용", sub: "응용 1~4장 + 자료구조", color: "var(--p-app)" },
  git:  { name: "PART 4 · Git & GitHub", sub: "버전 관리", color: "var(--p-git)" }
};

const STAGES =
[
{
  id: "class", part: "oop", src: "8장 인스턴스와 클래스",
  title: "클래스와 인스턴스",
  hook: "클래스는 붕어빵 틀, 인스턴스는 그 틀로 구운 진짜 붕어빵이에요.",
  points:
  [
    "오브젝트 = 현실의 모든 것 (용사, 슬라임, 아이템…)",
    "클래스 안에 <b>속성</b>은 필드로, <b>동작</b>은 메소드로 적어요.",
    "`new`로 인스턴스를 만들고 `변수.필드`, `변수.메소드()`로 써요.",
    "이름 규칙: 클래스는 `Hero` (첫 글자 대문자), 필드·메소드는 `findWeakPoint` (두 번째 단어부터 대문자)",
    "`final` 필드는 값이 안 바뀌는 상수, `this`는 \"나 자신\""
  ],
  file: "Hero.java",
  code:
`public class Hero
{
    String name;
    int hp;
    final int MAX_HP = 100;   // 상수: 못 바꿈

    void attack()
    {
        System.out.println(this.name + "의 공격!");
    }
}

Hero h = new Hero();   // 붕어빵 굽기
h.name = "용사";
h.hp = 100;
h.attack();            // 용사의 공격!`,
  quiz: { q: "Hero hero1 = new Hero(); 에서 클래스, 인스턴스, 변수는 각각 뭘까?", a: "Hero가 클래스(틀), new Hero()로 만들어진 것이 인스턴스(붕어빵), hero1은 그 인스턴스를 담아 둔 변수예요." }
},
{
  id: "ref", part: "oop", src: "9장 클래스",
  title: "참조 · 생성자 · static",
  hook: "클래스 타입 변수엔 인스턴스가 아니라 인스턴스가 있는 \"주소\"가 들어 있어요.",
  points:
  [
    "기본형(`int`, `double`, `boolean`)은 값을, 참조형(`Hero`, `String`)은 주소를 저장해요.",
    "참조형 변수를 다른 변수에 대입하면 <b>주소만 복사</b> → 둘이 같은 인스턴스를 가리켜요.",
    "생성자 = 클래스 이름과 같고 리턴 타입이 없는 메소드. `new` 직후 자동 실행!",
    "생성자를 하나도 안 만들면 컴파일러가 기본 생성자를 만들어 줘요.",
    "오버로드: 매개변수가 다르면 같은 이름 여러 개 OK. `this(...)`로 다른 생성자를 재사용",
    "`static` = 클래스에 딱 1개, 모두가 공유. static 메소드 안에선 static 아닌 멤버를 못 써요.",
    "필드 기본값: 숫자 0, boolean false, String·배열 null"
  ],
  file: "Cleric.java",
  code:
`public class Cleric
{
    static final int MAX_HP = 50;   // 모든 성직자가 공유
    String name;
    int hp;

    Cleric(String name, int hp)
    {
        this.name = name;
        this.hp = hp;
    }

    Cleric(String name)
    {
        this(name, MAX_HP);   // 위 생성자 재사용
    }
}

Cleric c1 = new Cleric("아서스");
Cleric c2 = c1;               // 주소만 복사!
c2.hp = 10;
System.out.println(c1.hp);    // 10`,
  quiz: { q: "위 코드에서 c2.hp만 바꿨는데 c1.hp도 10이 된 이유는?", a: "c1과 c2가 같은 인스턴스의 주소를 들고 있어서예요. 상자 두 개가 같은 물건 하나를 가리키는 셈이에요." }
},
{
  id: "encap", part: "oop", src: "10장 캡슐화",
  title: "캡슐화 · getter / setter",
  hook: "중요한 값은 금고(private)에 넣고, 정해진 창구(getter/setter)로만 꺼내요.",
  table:
  {
    head: ["접근 제어자", "누가 쓸 수 있나"],
    rows:
    [
      ["private", "내 클래스 안에서만"],
      ["(안 씀)", "같은 패키지"],
      ["protected", "같은 패키지 + 상속받은 자식"],
      ["public", "어디서나"]
    ]
  },
  points:
  [
    "캡슐화의 정석: 클래스 `public`, 메소드 `public`, 필드 `private`",
    "getter는 읽기, setter는 쓰기 담당",
    "setter 안에서 <b>이상한 값을 막는 것</b>이 캡슐화의 진짜 이유!",
    "잘못된 값이면 `throw new IllegalArgumentException(\"메시지\")`로 멈춰요."
  ],
  file: "Wand.java",
  code:
`public class Wand
{
    private String name;

    public String getName()
    {
        return name;
    }

    public void setName(String name)
    {
        if (name == null || name.length() < 3)
        {
            throw new IllegalArgumentException("이름은 3글자 이상!");
        }
        this.name = name;
    }
}`,
  quiz: { q: "hp에 음수가 들어오면 0이 되게 하려면 어디에 코드를 넣어야 할까?", a: "setHp() 안에 if (hp < 0) { hp = 0; } 를 넣으면 돼요. 필드가 private라서 setter를 거치지 않고는 못 바꾸니까 안전해요." }
},
{
  id: "inherit", part: "oop", src: "11장 상속",
  title: "상속 · 오버라이드 · super",
  hook: "부모 것을 그대로 물려받고, 새로 생긴 부분만 적으면 돼요. 복붙은 이제 그만!",
  points:
  [
    "`extends`로 상속해요. Java는 부모가 <b>딱 1명</b> (다중 상속 금지)",
    "오버라이드: 부모 메소드를 자식이 다시 작성 (`@Override` 붙이기)",
    "`super.메소드()`로 부모 기능 호출. 생성자 첫 줄엔 `super()`가 자동으로 들어가요.",
    "`final` 클래스는 상속 불가, `final` 메소드는 오버라이드 불가",
    "올바른 상속은 <b>is-a</b>: \"자식은 부모의 한 종류다\"가 말이 되어야 해요."
  ],
  file: "PoisonSlime.java",
  code:
`public class Slime
{
    public void attack()
    {
        System.out.println("슬라임의 몸통 박치기!");
    }
}

public class PoisonSlime extends Slime
{
    private int poisonCount = 5;

    @Override
    public void attack()

`public class Book implements Comparable<Book>
{
    String title;
    int year;

    @Override
    public String toString()
    {
        return "Book(" + title + ", " + year + ")";
    }

    @Override
    public boolean equals(Object o)
    {
        if (!(o instanceof Book b))
        {
            return false;
        }
        return year == b.year && Objects.equals(title, b.title);
    }

    @Override
    public int hashCode()
    {
        return Objects.hash(title, year);
    }

    @Override
    public int compareTo(Book other)

    }
}

git reset --hard <커밋ID>     # 그 시점으로 되돌리기 (주의!)`,
  quiz: { q: "이미 clone 한 프로젝트에서 친구가 새로 올린 코드를 받으려면?", a: "git pull" }
}
];

/* ---------- 간단 코드 색칠 ---------- */
function esc(s)
{
  return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

const JAVA_RE = /(\/\/[^\n]*)|("(?:[^"\\\n]|\\.)*")|(@\w+)|\b(public|private|protected|class|interface|extends|implements|abstract|static|final|void|int|double|boolean|char|long|new|return|if|else|for|while|this|super|throw|enum|true|false|null|instanceof)\b|\b(\d+)\b|\b([A-Z]\w*)\b/g;
const BASH_RE = /(#[^\n]*)|("(?:[^"\\\n]|\\.)*")|\b(git)\b/g;

function highlight(code, lang)
{
  const re = lang === "bash" ? BASH_RE : JAVA_RE;
  let out = "";
  let last = 0;
  re.lastIndex = 0;
  let m;
  while ((m = re.exec(code)) !== null)
  {
    out += esc(code.slice(last, m.index));
    const t = esc(m[0]);
    let cls;
    if (lang === "bash")
    {
      cls = m[1] ? "c" : m[2] ? "s" : "k";
    }
    else
    {
      cls = m[1] ? "c" : m[2] ? "s" : m[3] ? "a" : m[4] ? "k" : m[5] ? "n" : "t";
    }
    out += '<span class="' + cls + '">' + t + "</span>";
    last = m.index + m[0].length;
  }
  out += esc(code.slice(last));
  return out;
}

function inline(s)
{
  return s.replace(/`([^`]+)`/g, function (_, c)
  {
    return '<code class="i">' + esc(c) + "</code>";
  });
}

/* ---------- 진행도 ---------- */
let done = {};
try
{
  done = JSON.parse(localStorage.getItem("javaQuestDone") || "{}") || {};
}
catch (e)
{
  done = {};
}

function save()
{
  try
  {
    localStorage.setItem("javaQuestDone", JSON.stringify(done));
  }
  catch (e)
  {
  }
}

function updateXp()
{
  const n = STAGES.filter(function (s) { return done[s.id]; }).length;
  document.getElementById("xpFill").style.width = (n / STAGES.length * 100) + "%";
  document.getElementById("xpNum").textContent = n + " / " + STAGES.length + (n === STAGES.length ? "  올클리어!" : "");
}

/* ---------- 그리기 ---------- */
function render()
{
  const main = document.getElementById("main");
  let html = "";
  let lastPart = null;
  let num = 0;
  STAGES.forEach(function (s)
  {
    num++;
    const p = PARTS[s.part];
    if (s.part !== lastPart)
    {
      html += '<div class="part-head" data-part="' + s.part + '"><h2 style="color:' + p.color + '">' + p.name + "</h2><small>" + p.sub + "</small></div>";
      lastPart = s.part;
    }
    let left = "";
    if (s.table)
    {
      left += '<div class="tbl-wrap"><table><thead><tr>' +
        s.table.head.map(function (h) { return "<th>" + h + "</th>"; }).join("") +
        "</tr></thead><tbody>" +
        s.table.rows.map(function (r) { return "<tr>" + r.map(function (c) { return "<td>" + esc(c) + "</td>"; }).join("") + "</tr>"; }).join("") +
        "</tbody></table></div>";
    }
    left += '<ul class="points">' + s.points.map(function (pt) { return "<li>" + inline(pt) + "</li>"; }).join("") + "</ul>";
    left += '<details class="quiz"><summary>' + esc(s.quiz.q) + '</summary><div class="ans">' + esc(s.quiz.a) + "</div></details>";

    html +=
      '<section class="stage' + (done[s.id] ? " done" : "") + '" id="' + s.id + '" data-part="' + s.part + '" style="--pc:' + p.color + '">' +
        '<div class="stage-top">' +
          '<span class="badge">STAGE ' + String(num).padStart(2, "0") + "</span>" +
          '<div class="stage-title"><h3>' + s.title + '</h3><div class="src">수업 자료 · ' + s.src + "</div></div>" +
          '<button class="clear" id="clr-' + s.id + '" data-id="' + s.id + '" aria-pressed="' + (done[s.id] ? "true" : "false") + '">' + (done[s.id] ? "클리어!" : "클리어하기") + "</button>" +
        "</div>" +
        '<div class="hook">' + inline(s.hook) + "</div>" +
        '<div class="body">' +
          '<div class="left">' + left + "</div>" +
          '<div class="code"><div class="code-head"><span>' + s.file + '</span><span class="dots"><i></i><i></i><i></i></span></div><pre><code>' + highlight(s.code, s.lang) + "</code></pre></div>" +
        "</div>" +
      "</section>";
  });
  main.innerHTML = html;

  main.querySelectorAll(".clear").forEach(function (btn)
  {
    btn.addEventListener("click", function ()
    {
      const id = btn.dataset.id;
      done[id] = !done[id];
      save();
      const sec = document.getElementById(id);
      sec.classList.toggle("done", !!done[id]);
      btn.textContent = done[id] ? "클리어!" : "클리어하기";
      btn.setAttribute("aria-pressed", done[id] ? "true" : "false");
      updateXp();
    });
  });
}

function renderTabs()
{
  const tabs = document.getElementById("tabs");
  const list = [["all", "전체"], ["oop", "객체지향"], ["test", "테스트"], ["app", "응용"], ["git", "Git"]];
  tabs.innerHTML = list.map(function (t, i)
  {
    return '<button class="tab" id="tab-' + t[0] + '" data-f="' + t[0] + '" aria-pressed="' + (i === 0) + '">' + t[1] + "</button>";
  }).join("");
  tabs.querySelectorAll(".tab").forEach(function (b)
  {
    b.addEventListener("click", function ()
    {
      tabs.querySelectorAll(".tab").forEach(function (x) { x.setAttribute("aria-pressed", "false"); });
      b.setAttribute("aria-pressed", "true");
      const f = b.dataset.f;
      document.querySelectorAll("[data-part]").forEach(function (el)
      {
        el.hidden = !(f === "all" || el.dataset.part === f);
      });
    });
  });
}

renderTabs();
render();
updateXp();
</script>
